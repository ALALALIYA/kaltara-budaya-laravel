# nixpacks.toml — Railway build config for Laravel + FrankenPHP
# Railway uses FrankenPHP for Laravel apps, not php artisan serve.
# The full start command below ensures migrate + seed run before FrankenPHP starts.

[start]
cmd = "php artisan migrate --force && php artisan db:seed --force && frankenphp run --config /etc/caddy/Caddyfile"
